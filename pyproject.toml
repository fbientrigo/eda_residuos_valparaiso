[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-residuos-valparaiso"
version = "0.1.0"
description = "Pipeline reproducible para estimar residuos organicos residenciales en Valparaiso."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "shapely>=2.0",
  "pyarrow>=15",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "folium>=0.17",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
residuos-valpo = "eda_residuos_valparaiso.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
